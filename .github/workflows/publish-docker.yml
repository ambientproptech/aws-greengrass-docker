name: Publish Docker image

on:
  workflow_dispatch:
  push:
    branches: [main, feat/lite-2.6.0]
    paths:
      - Dockerfile.full
      - Dockerfile.lite
      - ggl-container-init.service
      - greengrass.service
      - greengrass-entrypoint.sh
      - greengrass-lite-entrypoint.sh
      - scripts/ggl-bake-systemd-enables.sh
      - scripts/ggl-reconcile-component-units.sh
      - scripts/ggl-start-nucleus.sh
      - config/**
      - .github/workflows/publish-docker.yml

concurrency:
  group: publish-docker-${{ github.ref }}
  cancel-in-progress: true

env:
  GG_FULL_VERSION: "2.16.1"
  NUCLEUS_LITE_SOURCE_TAG: "v2.6.0"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        flavour: [full, lite]
    steps:
      - uses: actions/checkout@v4

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.CONTAINER_REGISTRY }}

      - name: Set image name
        run: |
          echo "IMAGE_NAME=${{ secrets.CONTAINER_REGISTRY }}/${{ secrets.IMAGE_NAME }}" >> "$GITHUB_ENV"

      - name: Set image tag version (${{ matrix.flavour }})
        run: |
          if [ "${{ matrix.flavour }}" = "lite" ]; then
            echo "IMAGE_TAG_VERSION=${NUCLEUS_LITE_SOURCE_TAG#v}" >> "$GITHUB_ENV"
          else
            echo "IMAGE_TAG_VERSION=${{ env.GG_FULL_VERSION }}" >> "$GITHUB_ENV"
          fi

      - name: Docker metadata (${{ matrix.flavour }})
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=${{ env.IMAGE_TAG_VERSION }}-${{ matrix.flavour }}-,format=short
            type=raw,value=${{ env.IMAGE_TAG_VERSION }}-${{ matrix.flavour }}-main,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push ${{ matrix.flavour }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.${{ matrix.flavour }}
          target: ${{ matrix.flavour == 'lite' && 'release' || '' }}
          platforms: ${{ secrets.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GREENGRASS_RELEASE_VERSION=${{ env.IMAGE_TAG_VERSION }}
            NUCLEUS_LITE_SOURCE_TAG=${{ env.NUCLEUS_LITE_SOURCE_TAG }}
          cache-from: |
            type=gha,scope=greengrass-${{ matrix.flavour }}
            type=gha,scope=greengrass-lite-build,enable=${{ matrix.flavour == 'lite' }}
          cache-to: |
            type=gha,mode=max,scope=greengrass-${{ matrix.flavour }}
            type=gha,mode=max,scope=greengrass-lite-build,enable=${{ matrix.flavour == 'lite' }}
