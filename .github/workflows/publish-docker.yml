name: Publish Docker image

on:
  workflow_dispatch:
  push:
    branches: [main, mdu2-23755-ci-cd]
    paths:
      - Dockerfile
      - Dockerfile.release
      - greengrass-entrypoint.sh
      - .github/workflows/publish-docker.yml

concurrency:
  group: publish-docker-${{ github.ref }}
  cancel-in-progress: true

env:
  GG_VERSION: "2.16.1"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.CONTAINER_REGISTRY }}

      - name: Set image name
        run: |
          echo "IMAGE_NAME=${{ secrets.CONTAINER_REGISTRY }}/${{ secrets.IMAGE_NAME }}" >> "$GITHUB_ENV"

      - name: Docker metadata (base)
        id: metabase
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=${{ env.GG_VERSION }}-base-,format=short
            type=raw,value=${{ env.GG_VERSION }}-base-main,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ secrets.PLATFORMS }}
          push: true
          tags: ${{ steps.metabase.outputs.tags }}
          labels: ${{ steps.metabase.outputs.labels }}
          build-args: |
            GREENGRASS_RELEASE_VERSION=${{ env.GG_VERSION }}
          cache-from: type=gha,scope=greengrass-base
          cache-to: type=gha,mode=max,scope=greengrass-base

      - name: Docker metadata (release)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=${{ env.GG_VERSION }}-,format=short
            type=raw,value=${{ env.GG_VERSION }}-main,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push release image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          platforms: ${{ secrets.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ env.IMAGE_NAME }}:${{ env.GG_VERSION }}-base-${{ env.SHORT_SHA }}
          cache-from: type=gha,scope=greengrass-release
          cache-to: type=gha,mode=max,scope=greengrass-release
